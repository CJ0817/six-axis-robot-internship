name: Six axis integration
on:
  push:
    branches: [main, 'codex/single-joint-pid*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install frozen simulation engines
        run: python -m pip install numpy==1.26.4 pybullet==3.2.7
      - name: Build planning kinematics and control
        run: |
          mkdir -p build
          gcc-13 -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared -Iinclude src/common/abi_probe.c src/common/abi_v1.c src/kinematics/forward.c src/kinematics/inverse.c -lm -o build/librobot_contract.so
          gcc-13 -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared -Iinclude src/planning/joint.c src/planning/cartesian.c -lm -o build/librobot_planning.so
          gcc-13 -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared -Iinclude src/control/pid.c -lm -o build/librobot_control.so
      - name: Clock and nonuniform interpolation regressions
        run: python -m unittest discover -s tests -p test_six_axis.py -v
      - name: Fixed low-speed six-axis trajectory and injected faults
        run: python scripts/verify_six_axis.py --output results/six-axis-cycle-fix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-axis-integration-evidence
          path: |
            results/six-axis-cycle-fix/
            !results/six-axis-cycle-fix/raw-evidence.zip
            !results/six-axis-cycle-fix/evidence-manifest.json
