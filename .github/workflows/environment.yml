name: Environment verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install pinned dependencies, build C/C++ and verify UR5
        env:
          ROBOT_PYTHON: python
        run: bash scripts/setup.sh
      - name: Standalone C library Python call
        run: .venv/bin/python examples/c_library_demo.py --report results/c-library/ci-python-report.json
      - name: Frozen ABI layout and symbols
        run: .venv/bin/python -m unittest discover -s tests -p 'test_abi_v1.py' -v
      - name: C analytic IK candidates and boundaries
        run: .venv/bin/python scripts/run_tests.py --suite ik --output results/test-runs/ik
      - name: FK performance evidence on shared runner
        continue-on-error: true
        run: .venv/bin/python scripts/run_tests.py --suite fk_performance --output results/test-runs/fk-performance
      - name: C FK Python boundary contract
        run: .venv/bin/python -m unittest discover -s tests -p 'test_c_forward.py' -v
      - name: Installation path regression
        run: .venv/bin/python -m unittest discover -s tests -p 'test_install_paths.py' -v
      - name: Unified smoke suite
        run: .venv/bin/python scripts/run_tests.py --suite smoke --output results/test-runs/smoke
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-evidence
          path: |
            results/environment-check.json
            results/scene-demo/
            results/c-library/ci-python-report.json
            build/CMakeCache.txt
            results/test-runs/smoke/
            results/test-runs/ik/
            results/test-runs/fk-performance/
          if-no-files-found: warn

  robotics-toolbox-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Verify test runner failure propagation
        run: python -m unittest discover -s tests -p 'test_runner.py' -v
      - name: Install locked reference dependencies and run baseline
        env:
          ROBOT_PYTHON: python
        run: bash scripts/setup_baseline.sh
      - name: Verify model mismatch detection
        run: .venv-baseline/bin/python -m unittest discover -s tests -p 'test_model_alignment.py' -v
      - name: Verify nominal UR5 model alignment
        run: .venv-baseline/bin/python scripts/run_tests.py --suite model --output results/test-runs/model
      - name: Build C FK and run cross-implementation checks
        run: |
          mkdir -p build
          gcc-13 -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared -Iinclude src/common/abi_probe.c src/common/abi_v1.c src/kinematics/forward.c src/kinematics/inverse.c -lm -o build/librobot_contract.so
          gcc-13 -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Iinclude tests/kinematics/test_fk.c src/kinematics/forward.c -lm -o build/fk_unit
          .venv-baseline/bin/python scripts/run_tests.py --suite fk --output results/test-runs/fk
      - name: Known-pose FK comparison and discrepancy localization
        run: .venv-baseline/bin/python scripts/run_tests.py --suite fk_known --output results/test-runs/fk-known
      - name: Validate frozen IK targets without running IK
        run: .venv-baseline/bin/python scripts/run_tests.py --suite ik_prepare --output results/test-runs/ik-prepare
      - name: Verify frozen targets reject accidental changes
        run: .venv-baseline/bin/python -m unittest discover -s tests -p 'test_ik_preparation.py' -v
      - name: FK boundaries and isolated exceptions
        run: .venv-baseline/bin/python scripts/run_tests.py --suite fk_robustness --output results/test-runs/fk-robustness
      - name: Save reference readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotics-toolbox-baseline
          path: |
            results/test-runs/baseline/
            results/test-runs/model/
            results/test-runs/fk/
            results/test-runs/fk-known/
            results/test-runs/ik-prepare/
            results/test-runs/fk-robustness/
          if-no-files-found: warn
