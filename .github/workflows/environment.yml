name: Environment verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install pinned dependencies, build C/C++ and verify UR5
        env:
          ROBOT_PYTHON: python
        run: bash scripts/setup.sh
      - name: Standalone C library Python call
        run: .venv/bin/python examples/c_library_demo.py --report results/c-library/ci-python-report.json
      - name: Unified smoke suite
        run: .venv/bin/python scripts/run_tests.py --suite smoke --output results/test-runs/smoke
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-evidence
          path: |
            results/environment-check.json
            results/scene-demo/
            results/c-library/ci-python-report.json
            build/CMakeCache.txt
            results/test-runs/smoke/
          if-no-files-found: warn

  robotics-toolbox-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Verify test runner failure propagation
        run: python -m unittest discover -s tests -p 'test_runner.py' -v
      - name: Install locked reference dependencies and run baseline
        env:
          ROBOT_PYTHON: python
        run: bash scripts/setup_baseline.sh
      - name: Save reference readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotics-toolbox-baseline
          path: results/test-runs/baseline/
          if-no-files-found: warn
