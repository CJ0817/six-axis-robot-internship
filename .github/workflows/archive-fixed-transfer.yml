name: Archive verified fixed transfer evidence
on:
  push:
    branches: ['codex/single-joint-pid-feedforward']
    paths: ['.github/workflows/archive-fixed-transfer.yml']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/single-joint-pid-feedforward
      - name: Download exact verified run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api repos/CJ0817/six-axis-robot-internship/actions/artifacts/12021572099/zip > build/archive-source.zip
          gh api repos/CJ0817/six-axis-robot-internship/actions/artifacts/12020374763/zip > build/first-attempt.zip
      - name: Verify and archive complete data without rerunning simulation
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('.')
          out=root/'results/fixed-transfer'
          out.mkdir(parents=True,exist_ok=True)
          artifact=root/'build/archive-source.zip'
          failure=root/'build/first-attempt.zip'
          assert hashlib.sha256(artifact.read_bytes()).hexdigest()=='2c7e432d37ccecf4cc030bba26734f6ade613f87d52ee321c8df2bf12aac3390'
          assert hashlib.sha256(failure.read_bytes()).hexdigest()=='02d6098592ec3268ae0d38405f5702cfff145df01d3a7a76c6dd47421edd25d6'
          with zipfile.ZipFile(artifact) as z:
              for name in ('report.json','demo.mp4','scene.json','core-api-example.json'):
                  (out/name).write_bytes(z.read(name))
          report=json.loads((out/'report.json').read_text())
          assert report['passed'] and report['global_ticks']==2700 and report['zero_target_count']==4
          assert report['direct_route_counterexample']['code']==3003
          assert all(s['code']==0 for s in report['stages'])
          summary=dict(report)
          summary['direct_route_counterexample']={'code':3003,'message':report['direct_route_counterexample']['message'],'data':None,'complete_record':'raw-evidence.zip/report.json'}
          (out/'report-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          archive=out/'raw-evidence.zip'
          archive.write_bytes(artifact.read_bytes())
          with zipfile.ZipFile(archive,'a') as z:
              entry=zipfile.ZipInfo('first-attempt/evidence.zip',(2026,10,16,0,0,0))
              entry.compress_type=zipfile.ZIP_DEFLATED
              z.writestr(entry,failure.read_bytes())
          with zipfile.ZipFile(archive) as z:
              files={n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.endswith('/')}
          manifest={'code_commit':'7e100843cae81e2aa83b9b30af5cab9a02d6ad12','workflow_run':'https://github.com/CJ0817/six-axis-robot-internship/actions/runs/38841281447','artifact_id':12021572099,'artifact_sha256':hashlib.sha256(artifact.read_bytes()).hexdigest(),'archive_file':'raw-evidence.zip','archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'archive_bytes':archive.stat().st_size,'files_sha256':files,'first_failure_run':'https://github.com/CJ0817/six-axis-robot-internship/actions/runs/38840256097','video_check':{'duration_s':54,'frames':540,'fps':10}}
          (out/'evidence-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          lines=['# 固定搬运与独立 C 核心验收','','已完成任务原点、抓取、携物避障中间点、放置和返回。结果为 UR5/PyBullet 动力学仿真；抓取采用理想固定约束，放置采用静态虚拟料位，未验证真实夹爪。','','|验收项|结果|','|---|---:|','|共享规划／IK／插补／控制／反馈周期|20 ms|','|时长／运动区间|54 s／2700|','|阶段末速度归零命令|4 条，单列 zero-targets.csv|','|物体质量／边长|30 g／16 mm|','|直达反例|3003，data=null；t=5.67 s|',f"|抓取及最大附着误差|{report['maximum_attachment_error_m']*1000:.7g} mm|",f"|落位及返回后物体保持误差|{report['actual_payload_retention_error_m']*1000:.7g} mm|",f"|返回原点最大关节误差|{report['return_max_error_rad']:.7g} rad|",f"|实际载荷最小间隙|{report['minimum_actual_payload_clearance_m']*1000:.7g} mm|",'|时序／控制／指令跳变错误|0／0／0|','','|运动段|全局拍号|IK 节点|认证间隙下界 mm|','|---|---|---:|---:|']
          for s in report['stages']:
              lines.append(f"|{s['stage']}|{s['start_global_tick']}–{s['end_global_tick']}|{s['ik_nodes']}|{s['minimum_certified_clearance_m']*1000:.7g}|")
          lines.extend(['','四段均从实际反馈重新规划并完整认证关节、TCP 导数、整臂、自碰撞及载荷。实际物体间隙与约束误差另行检查。2700 个全局运动区间拍号连续为 0…2699；4 条不推进物理时间的归零指令分别位于 225、1050、1875、2700 拍。阶段边界反馈以阶段和段内拍号区分。','','纯 C 核心已通过独立 CMake 构建、CTest、安装后外部 cc 编译和 /tmp 下运行。三个库动态依赖不含 Python、PyBullet、NumPy 或 libstdc++；冻结 ABI 仍限 Linux x86_64。外部 C 示例输出 code=0、ABI=65536、IK 解数 1、executable=false；C 数值参考不等于完整碰撞认证后的设备许可。','','[54 秒、540 帧演示](../results/fixed-transfer/demo.mp4) · [完整日志](../results/fixed-transfer/raw-evidence.zip) · [摘要](../results/fixed-transfer/report-summary.json) · [校验清单](../results/fixed-transfer/evidence-manifest.json)','','完整日志包含每段规划／IK／认证 JSON、每拍控制和物体反馈、全局指令、归零目标、异常、抓放事件、五个阶段 PNG、MP4 与全部独立 C 构建／测试／安装／依赖日志。首次失败报告及片段保存在 first-attempt/evidence.zip：实际反馈微小姿态误差被严格 fixed 规则拒为 1007；改为实际姿态到目标的 SLERP 后重新完整认证并通过。','','接口与复现命令见 [场景及接口协议](../docs/fixed-transfer.md)，问题状态、负责人和关闭条件见 [集成问题表](../docs/integration-issues.md)。未关闭限制包括真实夹爪、料台接触、硬件停车／实时性及 Windows 冻结 ABI 支持。','','源码提交 7e100843cae81e2aa83b9b30af5cab9a02d6ad12；[固定搬运及独立 C Actions 通过](https://github.com/CJ0817/six-axis-robot-internship/actions/runs/38841281447)。'])
          (root/'reports/fixed-transfer.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit evidence by normal fast-forward push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/fixed-transfer.md results/fixed-transfer/report-summary.json results/fixed-transfer/demo.mp4 results/fixed-transfer/raw-evidence.zip results/fixed-transfer/scene.json results/fixed-transfer/core-api-example.json results/fixed-transfer/evidence-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs(integration): archive verified fixed transfer logs demo and C acceptance'
          git push origin HEAD:codex/single-joint-pid-feedforward
